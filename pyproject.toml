[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "dokhaneh"
version = "0.1.0"
description = "Publish releases to GitHub and Iranian domestic hosts at once, with an Ed25519-signed manifest proving every mirror is identical."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "mrzroot" }]
keywords = ["release", "mirror", "iran", "arvancloud", "liara", "gitea", "s3", "ed25519", "github-action"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "boto3>=1.34",
  "PyNaCl>=1.5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "moto[s3]>=5", "ruff>=0.5"]

[project.scripts]
dokhaneh = "dokhaneh.cli:app"

[project.urls]
Homepage = "https://github.com/mrzroot/dokhaneh"
Issues = "https://github.com/mrzroot/dokhaneh/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dokhaneh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "UP045", "UP007"]  # Typer uses calls in defaults / Optional[]

[tool.ruff.lint.isort]
known-first-party = ["dokhaneh", "conftest"]
