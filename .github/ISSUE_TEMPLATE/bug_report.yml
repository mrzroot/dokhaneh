name: 🐛 Bug report
description: Something crashes or behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! English or Persian are both fine. / گزارش به فارسی هم پذیرفته است.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - GitHub target
        - S3 targets (ArvanCloud, Liara, MinIO)
        - Gitea target
        - Manifest / signing
        - install.sh
        - verify / status
        - GitHub Action
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact command and the full output.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "output of `dokhaneh version`"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python version and OS"
